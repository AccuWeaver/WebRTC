name: WebRTC Manual Build
run-name: WebRTC Manual Build

env:
  XCODE_VERSION: 26.2

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "webRTC branch head. Ex: branch-heads/6167"
        required: true
        default: "branch-heads/0000"
        type: string
      ios:
        description: "Build iOS libraries"
        required: true
        default: true
        type: boolean
      macos:
        description: "Build macOS libraries"
        required: true
        default: true
        type: boolean
      maccatalyst:
        description: "Build macOS Catalyst libraries"
        required: true
        default: true
        type: boolean
      tvos:
        description: "Build tvOS libraries"
        required: true
        default: true
        type: boolean
jobs:
  Build-Script:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Building WebRTC framework
        run: |
          set -o pipefail
          sh scripts/clean.sh
          sh scripts/build.sh 2>&1 | tee build.log
        env:
          BRANCH: ${{ inputs.branch }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          MAC_CATALYST: ${{ inputs.maccatalyst }}
          TVOS: ${{ inputs.tvos }}

      - name: Upload framework
        uses: actions/upload-artifact@v6
        with:
          name: WebRTC.xcframework
          path: out/WebRTC-*.xcframework.zip

      - name: Print last 200 lines of build log on failure
        if: failure()
        run: |
          echo "=== LAST 200 LINES OF BUILD LOG ==="
          tail -200 build.log || echo "No build.log found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
